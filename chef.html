<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سرآشپز هوشمند</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body { font-family: 'Vazirmatn', system-ui, sans-serif; background-color: #fff7ed; -webkit-tap-highlight-color: transparent; }
        .loader { border-top-color: #f97316; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen pb-12">

    <header class="bg-gradient-to-l from-orange-600 to-amber-500 text-white p-5 shadow-lg rounded-b-3xl mb-6 sticky top-0 z-20">
        <div class="max-w-md mx-auto flex items-center justify-between gap-2">
            <div>
                <h1 class="text-xl font-black">سرآشپز هوشمند 👩‍🍳</h1>
                <p class="text-xs text-orange-100 mt-1">۱۰ مدل پیشنهاد جذاب برای هر نوع مواد اولیه!</p>
            </div>
            
            <select id="langSelect" onchange="changeLanguage(this.value)" 
                class="bg-white/25 text-white font-bold text-xs py-2 px-3 rounded-2xl backdrop-blur-md border border-white/30 focus:outline-none cursor-pointer">
                <option value="fa" class="text-slate-800">🇮🇷 فارسی</option>
                <option value="en" class="text-slate-800">🇬🇧 English</option>
                <option value="tr" class="text-slate-800">🇹🇷 Türkçe</option>
                <option value="ar" class="text-slate-800">🇸🇦 العربية</option>
            </select>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4">
        <div class="bg-white p-5 rounded-3xl shadow-md border border-orange-100 mb-6">
            <label id="inputLabel" class="block text-sm font-bold text-slate-700 mb-2">چه موادی تو یخچال یا کابینت داری؟</label>
            <textarea id="ingredients" rows="3" 
                class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm leading-relaxed"
                placeholder="مثلاً: مرغ، برنج، سیب‌زمینی، گوجه، پیاز، پنیر..."></textarea>
            
            <div id="quickTags" class="flex flex-wrap gap-1.5 mt-3 mb-4"></div>

            <button onclick="generateRecipes()" id="btn"
                class="w-full bg-orange-500 hover:bg-orange-600 active:scale-95 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-orange-500/30 transition flex items-center justify-center gap-2">
                <span id="btnText">دریافت ۱۰ مدل غذای متنوع ✨</span>
            </button>
        </div>

        <div id="loading" class="hidden flex-col items-center justify-center py-10">
            <div class="loader rounded-full border-4 border-slate-200 h-12 w-12 mb-3"></div>
            <p id="loadingText" class="text-sm text-slate-600 font-bold">هوش مصنوعی در حال خلق ۱۰ گزینه جذاب...</p>
        </div>

        <div id="results" class="space-y-5"></div>
    </main>

    <script>
        let currentLang = 'fa';

        const translations = {
            fa: { dir: 'rtl', label: 'چه موادی تو یخچال یا کابینت داری؟', placeholder: 'مثلاً: مرغ، برنج، سیب‌زمینی، گوجه، پیاز...', btn: 'دریافت ۱۰ مدل غذای متنوع ✨', loading: 'هوش مصنوعی در حال خلق ۱۰ مدل غذای جذاب...', alert: 'لطفاً چند ماده اولیه وارد کن!', ing: '🛒 مواد لازم و ترکیبات:', steps: '👩‍🍳 دستور پخت مرحله به مرحله:', tags: ['مرغ', 'تخم‌مرغ', 'سیب‌زمینی', 'برنج', 'گوشت', 'بادمجان', 'قارچ', 'گوجه'] },
            en: { dir: 'ltr', label: 'What ingredients do you have?', placeholder: 'e.g., chicken, rice, potato, tomato...', btn: 'Generate 10 Recipe Options ✨', loading: 'AI is generating 10 diverse recipes...', alert: 'Please enter some ingredients!', ing: '🛒 Ingredients:', steps: '👩‍🍳 Instructions:', tags: ['Chicken', 'Egg', 'Potato', 'Rice', 'Meat', 'Eggplant', 'Mushroom', 'Tomato'] },
            tr: { dir: 'ltr', label: 'Hangi malzemeleriniz var?', placeholder: 'Örn: tavuk, pirinç, patates, domates...', btn: '10 Farklı Tarif Üret ✨', loading: 'Yapay zeka 10 farklı tarif hazırlıyor...', alert: 'Lütfen malzeme girin!', ing: '🛒 Malzemeler:', steps: '👩‍🍳 Hazırlanışı:', tags: ['Tavuk', 'Yumurta', 'Patates', 'Pirinç', 'Et', 'Patlıcan', 'Mantar', 'Domates'] },
            ar: { dir: 'rtl', label: 'ما هي المكونات المتوفرة لديك؟', placeholder: 'مثال: دجاج، أرز، بطاطس، طماطم...', btn: 'احصل على ١٠ وجبات متنوعة ✨', loading: 'الذكاء الاصطناعي يبتكر ١٠ وصفات...', alert: 'يرجى إدخال المكونات!', ing: '🛒 المكونات:', steps: '👩‍🍳 طريقة التحضير:', tags: ['دجاج', 'بيض', 'بطاطس', 'أرز', 'لحم', 'باذنجان', 'فطر', 'طماطم'] }
        };

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            document.getElementById('htmlTag').setAttribute('dir', t.dir);
            document.getElementById('htmlTag').setAttribute('lang', lang);
            document.getElementById('inputLabel').innerText = t.label;
            document.getElementById('ingredients').placeholder = t.placeholder;
            document.getElementById('btnText').innerText = t.btn;
            document.getElementById('loadingText').innerText = t.loading;
            document.getElementById('results').innerHTML = '';
            renderTags();
        }

        function renderTags() {
            const t = translations[currentLang];
            document.getElementById('quickTags').innerHTML = t.tags.map(tag => 
                `<button onclick="addItem('${tag}')" class="text-xs bg-orange-50 hover:bg-orange-100 text-orange-700 px-3 py-1.5 rounded-full border border-orange-200 transition">+ ${tag}</button>`
            ).join('');
        }

        function addItem(item) {
            const el = document.getElementById('ingredients');
            const sep = (currentLang === 'fa' || currentLang === 'ar') ? '، ' : ', ';
            el.value = !el.value.trim() ? item : el.value + sep + item;
        }

        async function generateRecipes() {
            const t = translations[currentLang];
            const input = document.getElementById('ingredients').value.trim();
            if (!input) return alert(t.alert);

            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            results.innerHTML = '';
            loading.classList.remove('hidden');
            loading.classList.add('flex');

            setTimeout(() => {
                const words = input.split(/[\s،,-]+/).filter(w => w.length > 1);
                const main1 = words[0] || 'ماده اول';
                const main2 = words[1] || main1;

                // Generates 10 distinct recipes
                const dishes = [
                    {
                        name: `۱. خوراک ویژه و مجلسی با ${main1}`,
                        enName: `Gourmet dish with ${input}`,
                        time: '۴۰ دقیقه',
                        ingredients: `${input}، پیاز داغ، زعفران دم‌کرده، روغن زیتون، نمک و فلفل سیاه`,
                        steps: `۱. پیاز را نگینی خرد کرده و در تابه تفت دهید تا طلایی شود.\n۲. مواد اصلی (${input}) را افزوده و با حرارت ملایم تفت دهید.\n۳. کمی زعفران و آب اضافه کرده و بگذارید جا بیفتد.`
                    },
                    {
                        name: `۲. سرخ‌کرده یا گریل طلایی سرآشپز`,
                        enName: `Crispy pan fried special ${main1}`,
                        time: '۲۵ دقیقه',
                        ingredients: `${main1} و سایر مواد (${input})، کره، پودر سیر، ادویه مخصوص`,
                        steps: `۱. مواد را به قطعات دلخواه برش بزنید و با ادویه‌ها مزه‌دار کنید.\n۲. در تابه با کره یا روغن داغ با حرارت بالا سرخ یا گریل کنید.\n۳. به صورت گرم همراه با سبزیجات تازه سرو کنید.`
                    },
                    {
                        name: `۳. خورشت یا سوپ گرم ترکیبی`,
                        enName: `Hearty stew or soup with ${input}`,
                        time: '۵۰ دقیقه',
                        ingredients: `مجموعه مواد (${input})، رب گوجه‌فرنگی، پیاز، لیموعمانی یا ادویه`,
                        steps: `۱. پیاز و رب را در روغن تفت دهید تا رنگ باز کند.\n۲. مواد اولیه را اضافه کرده و آب جوش بریزید.\n۳. اجازه دهید با حرارت ملایم پخته و کاملاً غلیظ شود.`
                    },
                    {
                        name: `۴. مخلوط‌پلو سنتی با ${main1}`,
                        enName: `Traditional mixed rice with ${main1}`,
                        time: '۶۰ دقیقه',
                        ingredients: `برنج، ${input}, روغن، زعفران و ادویه دلخواه`,
                        steps: `۱. برنج را آبکش کنید.\n۲. مواد خرد شده (${input}) را تفت داده و به صورت لایه‌لایه یا مخلوط با برنج دم بگذارید.\n۳. پس از دم کشیدن با زعفران تزیین کنید.`
                    },
                    {
                        name: `۵. خوراک سریع تابهٔ فوری`,
                        enName: `Quick skillet meal with ${input}`,
                        time: '۲۰ دقیقه',
                        ingredients: `${input}، تخم‌مرغ یا پنیر، روغن، ادویه جات`,
                        steps: `۱. تمامی مواد را به قطعات ریز خرد کنید.\n۲. در تابه با کمی روغن سریع تفت دهید.\n۳. در صورت تمایل تخم‌مرغ یا پنیر روی آن اضافه کرده و سرو کنید.`
                    },
                    {
                        name: `۶. گراتن و پخت تنوری با پنیر`,
                        enName: `Cheesy baked casserole with ${input}`,
                        time: '۴۵ دقیقه',
                        ingredients: `${input}، پنیر پیتزا یا موزارلا، شیر، کره، آرد`,
                        steps: `۱. مواد را تفت داده و در ظرف مخصوص فر بریزید.\n۲. سس سفید ملایم روی آن بپاشید و لایه رویی را با پنیر بپوشانید.\n۳. در فر قرار دهید تا پنیر طلایی و برشته شود.`
                    },
                    {
                        name: `۷. سالاد گرم رژیمی و مغذی`,
                        enName: `Warm healthy diet salad with ${input}`,
                        time: '۲۰ دقیقه',
                        ingredients: `${input}، کاهو یا سبزیجات، آبلیمو، روغن زیتون، کنجد`,
                        steps: `۱. ${main1} را گریل یا بخارپز کنید.\n۲. روی بستر سبزیجات تازه بچینید.\n۳. با سس آبلیمو و روغن زیتون طعم‌دار کنید.`
                    },
                    {
                        name: `۸. رول یا ساندویچ نانی خوشمزه`,
                        enName: `Delicious wrap or sandwich with ${input}`,
                        time: '۱۵ دقیقه',
                        ingredients: `${input}، نان باگت یا لواش، سس دلخواه، کاهو و خیارشور`,
                        steps: `۱. مواد اولیه را با پیاز و ادویه تفت دهید تا کاملاً پخته شود.\n۲. داخل نان به همراه کاهو و گوجه قرار دهید.\n۳. به صورت ساندویچ گرم میل کنید.`
                    },
                    {
                        name: `۹. املت یا خاگینه ترکیبی خلاقانه`,
                        enName: `Creative mixed omelet with ${input}`,
                        time: '۱۵ دقیقه',
                        ingredients: `${input}، تخم‌مرغ، کره، نمک، فلفل سیاه`,
                        steps: `۱. مواد خرد شده را در تابه تفت دهید تا نرم شوند.\n۲. تخم‌مرغ‌ها را روی آن بشکنید و هم بزنید.\n۳. تا بسته شدن تخم‌مرغ‌ها صبر کرده و گرم سرو کنید.`
                    },
                    {
                        name: `۱۰. ته چین یا برنج قالبی زعفرانی`,
                        enName: `Saffron layered Tahchin with ${input}`,
                        time: '۵۵ دقیقه',
                        ingredients: `برنج آبکش‌شده، ماست چکیده، زرده تخم‌مرغ، زعفران، ${input}`,
                        steps: `۱. برنج را با ماست، زرده تخم‌مرغ و زعفران فراوان مخلوط کنید.\n۲. نیمی از برنج را در ظرف ریخته، مواد (${input}) را وسط آن بچینید و روی آن را با بقیه برنج بپوشانید.\n۳. دم بگذارید تا ته دیگ طلایی و ترد شود.`
                    }
                ];

                results.innerHTML = dishes.map((r, i) => {
                    const imgPrompt = encodeURIComponent(`${r.enName}, professional restaurant food photography, highly detailed, 8k, warm lighting`);
                    const imgUrl = `https://image.pollinations.ai/prompt/${imgPrompt}?width=700&height=500&nologo=true&seed=${Date.now() + i}`;
                    
                    return `
                    <div class="bg-white rounded-3xl shadow-md border border-orange-100 overflow-hidden transition hover:shadow-lg">
                        <div class="relative h-52 bg-slate-100">
                            <img src="${imgUrl}" alt="${r.name}" class="w-full h-full object-cover" loading="lazy">
                            <span class="absolute top-3 left-3 bg-black/60 backdrop-blur-md text-white text-xs px-3 py-1.5 rounded-full">⏱️ ${r.time}</span>
                        </div>
                        <div class="p-5">
                            <h2 class="text-lg font-black text-slate-800 mb-3">${r.name}</h2>
                            <div class="bg-orange-50 rounded-2xl p-3 mb-3 border border-orange-100">
                                <b class="text-xs text-orange-800 block mb-1">${t.ing}</b>
                                <p class="text-xs text-slate-700 leading-relaxed">${r.ingredients}</p>
                            </div>
                            <div>
                                <b class="text-xs text-slate-700 block mb-1">${t.steps}</b>
                                <p class="text-xs text-slate-600 leading-6 whitespace-pre-line">${r.steps}</p>
                            </div>
                        </div>
                    </div>`;
                }).join('');

                loading.classList.add('hidden');
                loading.classList.remove('flex');
            }, 600);
        }

        renderTags();
    </script>
</body>
</html>
