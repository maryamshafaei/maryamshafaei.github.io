<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خانه‌نگار | طراحی مفهومی ۱۰ مرحله‌ای</title>
<style>
:root{
  --g:#163c32;--g2:#2a5c4a;--g3:#3d7a64;
  --bg:#f2f5f3;--card:#fff;--bd:#d5e0d9;--tx:#1f2e28;--mu:#65756c;
  --soft:#e6f0ea;--acc:#c9a14a;--red:#b44a3c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:13.5px;line-height:1.75}
header{background:linear-gradient(135deg,#12352c,#1c4a3c);color:#fff;padding:16px 4%;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.logo{font-size:18px;font-weight:bold}.logo small{display:block;font-size:10px;font-weight:normal;color:#b5cfc4;margin-top:2px}
#nav{display:flex;gap:4px;overflow-x:auto;max-width:72%}
.nb{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#cde0d6;padding:6px 9px;border-radius:7px;font-size:10px;cursor:pointer;white-space:nowrap}
.nb.on{background:#fff;color:var(--g);font-weight:bold}
.nb.done{background:rgba(255,255,255,.22);color:#fff}
main{max-width:1180px;margin:0 auto;padding:20px 14px 40px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px rgba(22,60,50,.04)}
.panel h2{font-size:16px;color:var(--g);margin-bottom:6px}
.panel h3{font-size:13.5px;color:var(--g2);margin:12px 0 8px}
.hint{font-size:12px;color:var(--mu);margin-bottom:12px;line-height:1.85}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:11px}
label{display:block;font-size:11.5px;font-weight:bold;margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;font:12.5px Tahoma;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid #b5d2c4;border-color:var(--g2)}
textarea{min-height:70px;resize:vertical}
button{border:0;border-radius:8px;padding:10px 15px;font:12.5px Tahoma;font-weight:bold;cursor:pointer}
.pri{background:var(--g);color:#fff}.sec{background:var(--soft);color:var(--g)}.dan{background:#f7e9e7;color:var(--red)}
button:hover{filter:brightness(.96)}
.actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:space-between;margin-top:14px}
.met{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}
.m{background:var(--soft);padding:10px;border-radius:9px;text-align:center}
.m span{display:block;font-size:10.5px;color:var(--mu)}.m b{display:block;font-size:15px;margin-top:3px;color:var(--g)}
.note{background:#f8f4e9;border:1px solid #eadfc5;color:#6e5424;border-radius:9px;padding:11px 13px;font-size:11.5px;margin:10px 0;line-height:1.85}
.note.ok{background:#e7f3eb;border-color:#c3dfcb;color:#2a5c3a}
.roomg{display:flex;flex-wrap:wrap;gap:7px}
.rc{border:1px solid var(--bd);border-radius:8px;padding:7px 11px;background:#fff;font-size:12px}
.rc.on{border-color:var(--g2);background:#f0f6f2}
.rc label{display:flex;align-items:center;gap:6px;cursor:pointer;margin:0;font-weight:normal}
.rc input{width:14px;height:14px;accent-color:var(--g)}
.plans3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.plans3{grid-template-columns:1fr}}
.pcard{border:1px solid var(--bd);border-radius:11px;overflow:hidden;background:#fff;transition:.2s}
.pcard.sel{border:2px solid var(--g2);box-shadow:0 4px 14px rgba(22,60,50,.12)}
.pcard h3{padding:10px 12px 2px;font-size:13px}
.pcard .desc{padding:0 12px 8px;font-size:11px;color:var(--mu)}
.pbox{background:#f4f8f5;padding:6px}
svg.plan{display:block;width:100%;background:#fff;border-radius:4px}
.pfoot{padding:8px 12px 12px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px}
.viewer{width:100%;height:400px;position:relative;background:linear-gradient(#e5efe9,#d0e1d7);border-radius:11px;overflow:hidden}
#c3d{width:100%;height:100%;display:block}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.tab{background:#fff;border:1px solid var(--bd);color:var(--g);padding:6px 11px;border-radius:7px;font-size:11.5px}
.tab.on{background:var(--g);color:#fff}
.hidden{display:none!important}
.tag{display:inline-block;background:var(--soft);color:var(--g);padding:2px 7px;border-radius:20px;font-size:10.5px}
footer{text-align:center;color:var(--mu);font-size:11px;padding:16px}
.status{font-size:12px;color:var(--g2);margin-top:6px;min-height:16px}
.country-info{background:#f0f6f2;border:1px solid #c5dfcb;border-radius:8px;padding:10px 12px;font-size:12px;margin-top:8px;line-height:1.8}
</style>
</head>
<body>
<header>
  <div class="logo">خانه‌نگار<small>۱۰ مرحله طراحی مفهومی واقع‌گرایانه</small></div>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<div class="actions" style="max-width:1180px;margin:0 auto;padding:0 14px 24px">
  <button class="sec" id="btnPrev">→ مرحله قبل</button>
  <button class="pri" id="btnNext">مرحله بعد ←</button>
</div>
<div class="status" id="st" style="max-width:1180px;margin:0 auto;padding:0 14px"></div>
<footer>خانه‌نگار | راه‌پله و آسانسور اصولی • در و پنجره مشخص • سه طرح در مرحله نهایی • ضوابط کشورها</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";

/* ========== COUNTRY PROFILES ========== */
const COUNTRIES = {
  iran: {
    name: "ایران",
    maxFloors: 2,
    coverage: 60,
    setN: 0, setS: 3, setE: 0, setW: 0,
    parking: 1,
    note: "مقادیر رایج کلی: سطح اشغال حدود ۶۰٪، عقب‌نشینی ضلع دسترسی معمولاً بیشتر. ضوابط دقیق هر شهر و منطقه متفاوت است و باید از شهرداری همان محل استعلام شود."
  },
  turkey: {
    name: "ترکیه",
    maxFloors: 3,
    coverage: 40,
    setN: 3, setS: 3, setE: 3, setW: 3,
    parking: 1,
    note: "در بسیاری از مناطق ترکیه عقب‌نشینی از همه اضلاع و محدودیت سطح اشغال سخت‌گیرانه‌تر است. ضوابط محلی (İmar) اولویت دارد."
  },
  uae: {
    name: "امارات متحده عربی",
    maxFloors: 3,
    coverage: 50,
    setN: 3, setS: 3, setE: 2, setW: 2,
    parking: 2,
    note: "ضوابط امارات (به‌ویژه دبی و ابوظبی) معمولاً پارکینگ بیشتر و محدودیت‌های ارتفاع و سطح اشغال مشخص دارند. قوانین هر امیری‌نشین متفاوت است."
  },
  germany: {
    name: "آلمان",
    maxFloors: 2,
    coverage: 40,
    setN: 3, setS: 3, setE: 3, setW: 3,
    parking: 1,
    note: "در آلمان (BauNVO و مقررات ایالتی) عقب‌نشینی و سطح اشغال اغلب محدود است. مقررات ایالت و شهرداری محل حاکم است."
  },
  usa: {
    name: "ایالات متحده",
    maxFloors: 2,
    coverage: 35,
    setN: 6, setS: 6, setE: 3, setW: 3,
    parking: 2,
    note: "ضوابط آمریکا کاملاً محلی (Zoning هر شهر/کانتی) است. مقادیر بالا صرفاً نمونه رایج حومه است و باید با Zoning محل تطبیق داده شود."
  },
  custom: {
    name: "سفارشی",
    maxFloors: 2,
    coverage: 60,
    setN: 0, setS: 3, setE: 0, setW: 0,
    parking: 1,
    note: "مقادیر را خودتان مطابق ضوابط کشور یا شهر موردنظر وارد کنید."
  }
};

/* ========== STATE ========== */
const S = {
  step: 1, total: 10,
  land: {w:12, d:20, north:"top", access:"south"},
  neigh: {n:"unknown", s:"unknown", e:"unknown", w:"unknown"},
  country: "iran",
  rules: {maxF:2, cov:60, setN:0, setS:3, setE:0, setW:0, park:1},
  needs: {floors:2, beds:3, baths:2, prio:"balance", extra:["living","kitchen","dining","parking","yard"]},
  env: {noise:"unknown", privacy:"medium", slope:"flat"},
  layouts: null,   // {A,B,C}
  selected: "A",
  viewFloor: 1
};

const TITLES = [
  "۱. زمین","۲. همسایه‌ها","۳. ضوابط کشورها","۴. نیازها","۵. محیط",
  "۶. بررسی","۷. تولید سه طرح","۸. پلان دوبعدی","۹. مدل سه‌بعدی","۱۰. خروجی"
];

/* ========== NAV ========== */
function nav(){
  const n = document.getElementById("nav");
  n.innerHTML = TITLES.map((t,i)=>`<button class="nb ${i+1===S.step?"on":""} ${i+1<S.step?"done":""}" data-g="${i+1}">${t}</button>`).join("");
  n.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>go(+b.dataset.g));
}
function go(n){
  if(n<1||n>S.total) return;
  collect();
  S.step = n;
  render();
  nav();
  document.getElementById("btnPrev").style.visibility = n===1?"hidden":"visible";
  document.getElementById("btnNext").textContent = n===S.total?"پایان":"مرحله بعد ←";
  if(n===7 && !S.layouts) genThree();
  if(n===8) drawAll2D();
  if(n===9) init3D();
  if(n===10) finalOut();
}
document.getElementById("btnPrev").onclick = ()=>go(S.step-1);
document.getElementById("btnNext").onclick = ()=>{
  if(S.step===S.total){document.getElementById("st").textContent="پروژه آماده است. می‌توانید خروجی بگیرید.";return;}
  go(S.step+1);
};

/* ========== COLLECT ========== */
function collect(){
  const $ = id=>document.getElementById(id);
  if(!$) return;
  if(S.step===1){
    if($("lw")){S.land.w=+$("lw").value||12;S.land.d=+$("ld").value||20;S.land.north=$("north").value;S.land.access=$("access").value;}
  }
  if(S.step===2){
    if($("nn")){S.neigh.n=$("nn").value;S.neigh.s=$("ns").value;S.neigh.e=$("ne").value;S.neigh.w=$("nw").value;}
  }
  if(S.step===3){
    if($("country")){
      S.country=$("country").value;
      S.rules.maxF=+$("rf").value||2;S.rules.cov=+$("rc").value||60;
      S.rules.setN=+$("rn").value||0;S.rules.setS=+$("rs").value||0;
      S.rules.setE=+$("re").value||0;S.rules.setW=+$("rw").value||0;
      S.rules.park=+$("rp").value||0;
    }
  }
  if(S.step===4){
    if($("nf")){
      S.needs.floors=+$("nf").value||2;S.needs.beds=+$("nb").value||3;
      S.needs.baths=+$("nba").value||2;S.needs.prio=$("np").value;
      S.needs.extra=[...document.querySelectorAll("#ex input:checked")].map(c=>c.value);
    }
  }
  if(S.step===5){
    if($("en")){S.env.noise=$("en").value;S.env.privacy=$("ep").value;S.env.slope=$("es").value;}
  }
}

/* ========== RENDER STEPS ========== */
function render(){
  const a = document.getElementById("app");
  const st = S.step;
  const buildableW = Math.max(0, S.land.w - S.rules.setE - S.rules.setW);
  const buildableD = Math.max(0, S.land.d - S.rules.setN - S.rules.setS);

  if(st===1) a.innerHTML=`
    <div class="panel"><h2>۱. اطلاعات زمین</h2>
    <p class="hint">ابعاد واقعی زمین و جهت شمال را وارد کنید.</p>
    <div class="grid">
      <div><label>عرض زمین (متر)</label><input type="number" id="lw" min="5" max="60" step="0.1" value="${S.land.w}"></div>
      <div><label>طول زمین (متر)</label><input type="number" id="ld" min="8" max="80" step="0.1" value="${S.land.d}"></div>
      <div><label>جهت شمال</label><select id="north">
        <option value="top" ${S.land.north==="top"?"selected":""}>بالای نقشه</option>
        <option value="right" ${S.land.north==="right"?"selected":""}>راست</option>
        <option value="bottom" ${S.land.north==="bottom"?"selected":""}>پایین</option>
        <option value="left" ${S.land.north==="left"?"selected":""}>چپ</option>
      </select></div>
      <div><label>ضلع دسترسی اصلی</label><select id="access">
        <option value="south">جنوب</option><option value="north">شمال</option>
        <option value="east">شرق</option><option value="west">غرب</option>
      </select></div>
    </div>
    <div class="met">
      <div class="m"><span>مساحت زمین</span><b>${(S.land.w*S.land.d).toFixed(1)} m²</b></div>
      <div class="m"><span>محیط</span><b>${(2*(S.land.w+S.land.d)).toFixed(1)} m</b></div>
    </div></div>`;

  if(st===2) a.innerHTML=`
    <div class="panel"><h2>۲. همسایه‌ها و محیط اطراف</h2>
    <p class="hint">وضعیت هر ضلع را مشخص کنید. روی نور، حریم خصوصی و جانمایی پنجره‌ها اثر دارد.</p>
    <div class="grid">
      <div><label>شمال</label><select id="nn">${optN(S.neigh.n)}</select></div>
      <div><label>جنوب</label><select id="ns">${optN(S.neigh.s)}</select></div>
      <div><label>شرق</label><select id="ne">${optN(S.neigh.e)}</select></div>
      <div><label>غرب</label><select id="nw">${optN(S.neigh.w)}</select></div>
    </div></div>`;

  if(st===3) a.innerHTML=`
    <div class="panel"><h2>۳. ضوابط کشورها و محدودیت ساخت</h2>
    <p class="hint">کشور را انتخاب کنید تا ضوابط پیش‌فرض بارگذاری شود. می‌توانید اعداد را ویرایش کنید.</p>
    <div class="grid">
      <div><label>کشور / پروفایل ضوابط</label>
        <select id="country">
          <option value="iran" ${S.country==="iran"?"selected":""}>ایران</option>
          <option value="turkey" ${S.country==="turkey"?"selected":""}>ترکیه</option>
          <option value="uae" ${S.country==="uae"?"selected":""}>امارات متحده عربی</option>
          <option value="germany" ${S.country==="germany"?"selected":""}>آلمان</option>
          <option value="usa" ${S.country==="usa"?"selected":""}>ایالات متحده</option>
          <option value="custom" ${S.country==="custom"?"selected":""}>سفارشی</option>
        </select>
      </div>
      <div><label>حداکثر طبقات</label><input type="number" id="rf" min="1" max="6" value="${S.rules.maxF}"></div>
      <div><label>سطح اشغال (%)</label><input type="number" id="rc" min="20" max="90" value="${S.rules.cov}"></div>
      <div><label>عقب‌نشینی شمال (متر)</label><input type="number" id="rn" min="0" step="0.5" value="${S.rules.setN}"></div>
      <div><label>عقب‌نشینی جنوب (متر)</label><input type="number" id="rs" min="0" step="0.5" value="${S.rules.setS}"></div>
      <div><label>عقب‌نشینی شرق (متر)</label><input type="number" id="re" min="0" step="0.5" value="${S.rules.setE}"></div>
      <div><label>عقب‌نشینی غرب (متر)</label><input type="number" id="rw" min="0" step="0.5" value="${S.rules.setW}"></div>
      <div><label>پارکینگ الزامی</label><input type="number" id="rp" min="0" max="4" value="${S.rules.park}"></div>
    </div>
    <div class="country-info" id="cInfo">${COUNTRIES[S.country].note}</div>
    <div class="met">
      <div class="m"><span>محدوده قابل ساخت</span><b>${buildableW.toFixed(1)}×${buildableD.toFixed(1)} m</b></div>
      <div class="m"><span>حداکثر سطح اشغال</span><b>${((S.land.w*S.land.d)*S.rules.cov/100).toFixed(0)} m²</b></div>
    </div>
    <div class="note">هزینه ساخت در این اپلیکیشن محاسبه نمی‌شود.</div></div>`;

  if(st===4) a.innerHTML=`
    <div class="panel"><h2>۴. نیازهای خانه</h2>
    <p class="hint">فضاها و تعداد طبقات را مشخص کنید. راه‌پله در ساختمان بیش از یک طبقه اجباری است.</p>
    <div class="grid">
      <div><label>تعداد طبقات موردنظر</label><select id="nf">
        <option value="1" ${S.needs.floors==1?"selected":""}>۱</option>
        <option value="2" ${S.needs.floors==2?"selected":""}>۲</option>
        <option value="3" ${S.needs.floors==3?"selected":""}>۳</option>
      </select></div>
      <div><label>اتاق خواب</label><input type="number" id="nb" min="1" max="7" value="${S.needs.beds}"></div>
      <div><label>سرویس بهداشتی</label><input type="number" id="nba" min="1" max="5" value="${S.needs.baths}"></div>
      <div><label>اولویت</label><select id="np">
        <option value="balance">تعادل</option><option value="light">نور</option>
        <option value="privacy">حریم</option><option value="efficiency">کارایی فضا</option>
      </select></div>
    </div>
    <h3>فضاهای اضافی</h3>
    <div class="roomg" id="ex">${["living","kitchen","dining","office","guest","laundry","storage","parking","yard","terrace","elevator"].map(r=>`
      <div class="rc ${S.needs.extra.includes(r)?"on":""}"><label><input type="checkbox" value="${r}" ${S.needs.extra.includes(r)?"checked":""}> ${nameR(r)}</label></div>`).join("")}
    </div>
    <div class="note">طبقات دوم به بعد فقط شامل فضاهای مسکونی و خدماتی منطقی (اتاق‌خواب، سرویس، راهرو، آسانسور/پله) هستند. حیاط در طبقه بالا قرار نمی‌گیرد.</div></div>`;

  if(st===5) a.innerHTML=`
    <div class="panel"><h2>۵. محیط و اولویت‌های تکمیلی</h2>
    <div class="grid">
      <div><label>آلودگی صوتی</label><select id="en"><option value="unknown">نامعلوم</option><option value="low">کم</option><option value="medium">متوسط</option><option value="high">زیاد</option></select></div>
      <div><label>حریم خصوصی محیط</label><select id="ep"><option value="good">مناسب</option><option value="medium" selected>متوسط</option><option value="poor">ضعیف</option></select></div>
      <div><label>شیب زمین</label><select id="es"><option value="flat">تقریباً مسطح</option><option value="north">به شمال</option><option value="south">به جنوب</option></select></div>
    </div></div>`;

  if(st===6) a.innerHTML=`
    <div class="panel"><h2>۶. بررسی اطلاعات</h2>
    <p class="hint">قبل از تولید طرح‌ها خلاصه را بررسی کنید.</p>
    <div class="met">
      <div class="m"><span>زمین</span><b>${S.land.w}×${S.land.d} m</b></div>
      <div class="m"><span>کشور</span><b>${COUNTRIES[S.country].name}</b></div>
      <div class="m"><span>طبقات</span><b>${S.needs.floors}</b></div>
      <div class="m"><span>اتاق خواب</span><b>${S.needs.beds}</b></div>
      <div class="m"><span>سطح اشغال</span><b>${S.rules.cov}%</b></div>
      <div class="m"><span>آسانسور</span><b>${S.needs.extra.includes("elevator")||S.needs.floors>2?"بله":"اختیاری"}</b></div>
    </div>
    <div class="note ok">اطلاعات کامل است. در مرحله بعد سه طرح مفهومی با در و پنجره مشخص تولید می‌شود.</div></div>`;

  if(st===7) a.innerHTML=`
    <div class="panel"><h2>۷. تولید سه طرح مفهومی</h2>
    <p class="hint">سه رویکرد متفاوت با راه‌پله و آسانسور واقع‌بینانه و در/پنجره مشخص.</p>

function nameR(r){return {living:"نشیمن",kitchen:"آشپزخانه",dining:"غذاخوری",office:"اتاق کار",guest:"اتاق مهمان",laundry:"رختشوی‌خانه",storage:"انباری",parking:"پارکینگ",yard:"حیاط",terrace:"تراس",elevator:"آسانسور"}[r]||r;}

/* ========== THREE LAYOUTS ========== */
function genThree(){
  collect();
  const floors = Math.min(S.needs.floors, S.rules.maxF, 3);
  const usableW = Math.max(6.5, S.land.w - S.rules.setE - S.rules.setW);
  const usableD = Math.max(8, S.land.d - S.rules.setN - S.rules.setS);
  const maxFoot = (S.land.w * S.land.d) * (S.rules.cov/100);
  let bw = Math.min(usableW*0.92, Math.sqrt(maxFoot*0.75));
  let bd = Math.min(usableD*0.88, maxFoot/Math.max(bw,1));
  if(bw<7) bw=Math.min(usableW,8.2);
  if(bd<9) bd=Math.min(usableD,11.5);

  const hasElev = S.needs.extra.includes("elevator") || floors>2;
  const hasPark = S.needs.extra.includes("parking") || S.rules.park>0;

  function make(type){
    const L = {id:type, buildW:bw, buildD:bd, floorsCount:floors, hasElev, hasPark, floors:{}, score:0};
    const stairW=2.4, stairD=3.2;
    const elevW=hasElev?1.8:0, elevD=hasElev?2.0:0;
    const coreX = type==="A"?bw*0.56 : type==="B"?bw*0.30 : bw*0.45;
    const coreY = type==="A"?bd*0.28 : type==="B"?bd*0.40 : bd*0.34;

    const R = (id,name,x,y,w,h,typ,door,wins)=>({id,name,x,y,w,h,type:typ,door:door||null,wins:wins||[]});

    for(let f=1;f<=floors;f++){
      const rooms=[];
      rooms.push(R("stairs","راه‌پله",coreX,coreY,stairW,stairD,"core",{side:"w",at:0.5},[]));
      if(hasElev) rooms.push(R("elev","آسانسور",coreX+stairW+0.22,coreY,elevW,elevD,"core",{side:"w",at:0.5},[]));

      if(f===1){
        const lw=Math.min(5.4,bw*0.41), ld=Math.min(4.6,bd*0.30);
        rooms.push(R("liv","نشیمن",0.35,0.35,lw,ld,"public",{side:"s",at:0.55},[{side:"n",at:0.5,len:0.45},{side:"w",at:0.4,len:0.35}]));
        if(S.needs.extra.includes("dining"))
          rooms.push(R("din","غذاخوری",0.35+lw+0.22,0.35,Math.min(3.6,bw*0.26),ld*0.85,"public",{side:"s",at:0.5},[{side:"n",at:0.5,len:0.4}]));
        const kw=Math.min(3.4,bw*0.27), kd=Math.min(3.2,bd*0.20);
        rooms.push(R("kit","آشپزخانه",bw-kw-0.35,0.35,kw,kd,"service",{side:"s",at:0.4},[{side:"n",at:0.5,len:0.35}]));
        rooms.push(R("ent","ورودی",0.3,bd-2.7,3.1,2.4,"service",{side:"n",at:0.5},[{side:"s",at:0.5,len:0.3}]));
        if(hasPark) rooms.push(R("park","پارکینگ",0.3,bd-5.4,Math.min(5.4,bw*0.43),5.0,"service",{side:"n",at:0.6},[]));
        rooms.push(R("bath0","سرویس",coreX-2.1,coreY+stairD+0.18,1.85,2.05,"service",{side:"e",at:0.5},[{side:"n",at:0.5,len:0.25}]));
      } else {
        // Upper floors: ONLY private + service. No yard, no parking.
        const bedW=Math.min(3.9,(bw-1.15)/Math.ceil(S.needs.beds/2));
        const bedD=Math.min(3.7,bd*0.27);
        for(let b=0;b<S.needs.beds;b++){
          const col=b%2, row=Math.floor(b/2);
          const doorSide = row===0?"s":"n";
          const winSide = row===0?"n":"s";
          rooms.push(R("bed"+b, b===0?"خواب اصلی":"خواب "+(b+1),
            0.35+col*(bedW+0.28), 0.35+row*(bedD+0.28), bedW, bedD, "private",
            {side:doorSide,at:0.5}, [{side:winSide,at:0.5,len:0.4},{side:col===0?"w":"e",at:0.4,len:0.3}]));
        }
        for(let t=0;t<Math.min(S.needs.baths,2);t++)
          rooms.push(R("bath"+t,"سرویس "+(t+1),bw-2.25-t*2.15,bd-2.55,1.95,2.15,"service",{side:"n",at:0.5},[{side:"s",at:0.5,len:0.25}]));
        if(S.needs.extra.includes("office")&&f===2)
          rooms.push(R("off","اتاق کار",bw-3.4,0.35,3.1,2.95,"private",{side:"s",at:0.5},[{side:"n",at:0.5,len:0.35},{side:"e",at:0.4,len:0.3}]));
        if(S.needs.extra.includes("guest")&&f===floors)
          rooms.push(R("guest","اتاق مهمان",0.35,bd-3.5,3.35,3.15,"private",{side:"n",at:0.5},[{side:"s",at:0.5,len:0.35}]));
      }
      L.floors[f]=rooms;
    }
    let score=72;
    if(type==="A"&&S.needs.prio==="light") score+=14;
    if(type==="B"&&S.needs.prio==="privacy") score+=14;
    if(type==="C") score+=8;
    if(hasElev) score+=4;
    L.score=Math.min(96,score);
    L.title = type==="A"?"طرح A — نورمحور":type==="B"?"طرح B — حریم‌محور":"طرح C — متعادل";
    L.desc = type==="A"?"تمرکز بر نور فضاهای عمومی":type==="B"?"تفکیک خصوصی و عمومی":"تعادل نور، حریم و کارایی";
    return L;
  }
  S.layouts={A:make("A"),B:make("B"),C:make("C")};
  S.selected="A"; S.viewFloor=1;
  document.getElementById("st").textContent="سه طرح با راه‌پله، آسانسور، در و پنجره مشخص تولید شد.";
}

/* ========== 2D DRAW WITH DOORS + WINDOWS ========== */
function drawPlan(svg, L, floor){
  const rooms=L.floors[floor]||[];
  const sc=18, m=28;
  const sw=L.buildW*sc+m*2+40, sh=L.buildD*sc+m*2+36;
  svg.setAttribute("viewBox",`0 0 ${sw} ${sh}`);
  const col={public:"#e6f0e2",private:"#e2ebf3",service:"#f1ebe0",core:"#d4e2f0"};
  let h=`<rect width="${sw}" height="${sh}" fill="#f5f9f6"/>
    <rect x="${m-8}" y="${m-8}" width="${L.buildW*sc+16}" height="${L.buildD*sc+16}" fill="#e3eee6" stroke="#8aa894" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="${m}" y="${m}" width="${L.buildW*sc}" height="${L.buildD*sc}" fill="#fff" stroke="#2a4a3c" stroke-width="2.2"/>`;
  rooms.forEach(r=>{
    const x=m+r.x*sc, y=m+r.y*sc, w=r.w*sc, hh=r.h*sc;
    const core=r.type==="core";
    h+=`<rect x="${x}" y="${y}" width="${w}" height="${hh}" fill="${col[r.type]||"#eee"}" stroke="${core?"#3a6a9a":"#5a7364"}" stroke-width="${core?2:1.2}"/>
      <text x="${x+w/2}" y="${y+hh/2-1}" text-anchor="middle" font-size="10" font-family="Tahoma" fill="#1f2e28" font-weight="${core?"bold":"normal"}">${r.name}</text>
      <text x="${x+w/2}" y="${y+hh/2+10}" text-anchor="middle" font-size="8.5" font-family="Tahoma" fill="#667a6e">${r.w.toFixed(1)}×${r.h.toFixed(1)}</text>`;
    // door
    if(r.door){
      const dlen=Math.min(0.85*sc,(r.door.side==="n"||r.door.side==="s"?w:hh)*0.32);
      const at=r.door.at;
      if(r.door.side==="s"){
        const dx=x+w*at-dlen/2, dy=y+hh-1.5;
        h+=`<rect x="${dx}" y="${dy}" width="${dlen}" height="3.5" fill="#fff" stroke="#222" stroke-width="1"/>`;
        h+=`<path d="M ${dx} ${dy} A ${dlen} ${dlen} 0 0 0 ${dx+dlen} ${dy-dlen}" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="2 1.5"/>`;
      } else if(r.door.side==="n"){
        const dx=x+w*at-dlen/2, dy=y-1.5;
        h+=`<rect x="${dx}" y="${dy}" width="${dlen}" height="3.5" fill="#fff" stroke="#222" stroke-width="1"/>`;
        h+=`<path d="M ${dx} ${dy+3.5} A ${dlen} ${dlen} 0 0 1 ${dx+dlen} ${dy+3.5+dlen}" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="2 1.5"/>`;
      } else if(r.door.side==="e"){
        const dx=x+w-1.5, dy=y+hh*at-dlen/2;
        h+=`<rect x="${dx}" y="${dy}" width="3.5" height="${dlen}" fill="#fff" stroke="#222" stroke-width="1"/>`;
        h+=`<path d="M ${dx} ${dy} A ${dlen} ${dlen} 0 0 0 ${dx-dlen} ${dy+dlen}" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="2 1.5"/>`;
      } else if(r.door.side==="w"){
        const dx=x-1.5, dy=y+hh*at-dlen/2;
        h+=`<rect x="${dx}" y="${dy}" width="3.5" height="${dlen}" fill="#fff" stroke="#222" stroke-width="1"/>`;
        h+=`<path d="M ${dx+3.5} ${dy} A ${dlen} ${dlen} 0 0 1 ${dx+3.5+dlen} ${dy+dlen}" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="2 1.5"/>`;
      }
    }
    // windows (blue marks on walls)
    (r.wins||[]).forEach(win=>{
      const wlen=(win.len||0.35)* (win.side==="n"||win.side==="s"?w:hh);
      const at=win.at||0.5;
      if(win.side==="n"){
        h+=`<rect x="${x+w*at-wlen/2}" y="${y-1}" width="${wlen}" height="3" fill="#5b9ec9" stroke="#2a6a9a" stroke-width="0.8"/>`;
      } else if(win.side==="s"){
        h+=`<rect x="${x+w*at-wlen/2}" y="${y+hh-2}" width="${wlen}" height="3" fill="#5b9ec9" stroke="#2a6a9a" stroke-width="0.8"/>`;
      } else if(win.side==="e"){
        h+=`<rect x="${x+w-2}" y="${y+hh*at-wlen/2}" width="3" height="${wlen}" fill="#5b9ec9" stroke="#2a6a9a" stroke-width="0.8"/>`;
      } else if(win.side==="w"){
        h+=`<rect x="${x-1}" y="${y+hh*at-wlen/2}" width="3" height="${wlen}" fill="#5b9ec9" stroke="#2a6a9a" stroke-width="0.8"/>`;
      }
    });
  });
  const nl={top:"شمال ↑",right:"شمال ←",bottom:"شمال ↓",left:"شمال →"}[S.land.north]||"شمال ↑";
  h+=`<text x="${sw-10}" y="16" text-anchor="end" font-size="10" font-family="Tahoma" fill="#163c32" font-weight="bold">${nl}</text>
    <text x="${m}" y="${sh-6}" font-size="9" font-family="Tahoma" fill="#667a6e">طبقه ${floor} | در=قوس • پنجره=آبی</text>`;
  svg.innerHTML=h;
}

function drawAll2D(){
  if(!S.layouts) genThree();
  const wrap=document.getElementById("plans3");
  if(!wrap) return;
  wrap.innerHTML="";
  ["A","B","C"].forEach(key=>{
    const des=S.layouts[key];
    const card=document.createElement("div");
    card.className="pcard"+(key===S.selected?" sel":"");
    card.innerHTML=`<h3>${des.title} <span class="tag">${des.score}</span></h3>
      <div class="desc">${des.desc}</div>
      <div class="pbox"><svg class="plan" id="svg${key}"></svg></div>
      <div class="pfoot"><span>${des.buildW.toFixed(1)}×${des.buildD.toFixed(1)} m</span>
        <button class="pri" data-sel="${key}" style="padding:6px 10px;font-size:11px">انتخاب</button></div>`;
    wrap.appendChild(card);
    drawPlan(document.getElementById("svg"+key), des, S.viewFloor);
  });
  wrap.querySelectorAll("[data-sel]").forEach(btn=>{
    btn.onclick=()=>{S.selected=btn.dataset.sel;drawAll2D();};
  });
}

/* ========== 3D ========== */
let scene,cam,ren,house,animId,autoR=false,roofVis=true,rotY=.7,rotX=.38,dist=36;
function init3D(){
  if(!S.layouts) genThree();
  const c=document.getElementById("c3d");
  if(!window.THREE){document.getElementById("ms3").textContent="Three.js بارگذاری نشد";return;}
  if(ren){cancelAnimationFrame(animId);ren.dispose();}
  scene=new THREE.Scene();scene.background=new THREE.Color(0xe5eee9);
  cam=new THREE.PerspectiveCamera(40,c.clientWidth/c.clientHeight,.1,400);
  ren=new THREE.WebGLRenderer({canvas:c,antialias:true});
  ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(c.clientWidth,c.clientHeight);ren.shadowMap.enabled=true;
  scene.add(new THREE.AmbientLight(0xffffff,.72));
  const sun=new THREE.DirectionalLight(0xfff5e6,.9);sun.position.set(28,42,22);sun.castShadow=true;scene.add(sun);
  const g=new THREE.Mesh(new THREE.BoxGeometry(S.land.w+5,.22,S.land.d+5),new THREE.MeshStandardMaterial({color:0x9bb09c,roughness:.95}));
  g.position.y=-.18;g.receiveShadow=true;scene.add(g);
  house=new THREE.Group();scene.add(house);
  build3D();updCam();animate();
  document.getElementById("ms3").textContent="مدل طرح "+S.selected;
  let drag=false,lx,ly;
  c.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;c.setPointerCapture(e.pointerId);};
  c.onpointermove=e=>{if(!drag)return;rotY+=(e.clientX-lx)*.008;rotX=Math.max(-.12,Math.min(1.15,rotX+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY;updCam();};
  c.onpointerup=()=>drag=false;
  c.onwheel=e=>{e.preventDefault();dist=Math.max(12,Math.min(70,dist+e.deltaY*.035));updCam();};
}
function build3D(){
  if(!house||!S.layouts)return;
  while(house.children.length)house.remove(house.children[0]);
  const L=S.layouts[S.selected];
  const wallH=2.95,ft=.2;
  const wMat=new THREE.MeshStandardMaterial({color:0xf0ebe3,roughness:.87});
  const fMat=new THREE.MeshStandardMaterial({color:0xb8a88a,roughness:.84});
  const cMat=new THREE.MeshStandardMaterial({color:0xc5d4e0,roughness:.8});
  const rMat=new THREE.MeshStandardMaterial({color:0x6d8070,roughness:.9});
  const gMat=new THREE.MeshStandardMaterial({color:0x5b9ec9,roughness:.2,metalness:.1,transparent:true,opacity:.7});
  const ox=-L.buildW/2,oz=-L.buildD/2;
  for(let f=1;f<=L.floorsCount;f++){
    const grp=new THREE.Group();grp.position.y=(f-1)*(wallH+ft);house.add(grp);
    const slab=new THREE.Mesh(new THREE.BoxGeometry(L.buildW+.12,ft,L.buildD+.12),fMat);
    slab.position.y=ft/2;slab.receiveShadow=true;grp.add(slab);
    (L.floors[f]||[]).forEach(r=>{
      const cx=ox+r.x+r.w/2,cz=oz+r.y+r.h/2;
      const mat=r.type==="core"?cMat:wMat;
      const patch=new THREE.Mesh(new THREE.BoxGeometry(r.w-.1,.05,r.h-.1),new THREE.MeshStandardMaterial({
        color:r.type==="public"?0xdce8d6:r.type==="private"?0xd6e0ea:r.type==="core"?0xc8d6e4:0xe8dfd0,roughness:.9}));
      patch.position.set(cx,ft+.03,cz);grp.add(patch);
      const h=wallH-.12,t=.13,wy=ft+h/2;
      [[r.w,t,cx,cz-r.h/2],[r.w,t,cx,cz+r.h/2],[t,r.h,cx-r.w/2,cz],[t,r.h,cx+r.w/2,cz]].forEach(([ww,wd,wx,wz])=>{
        const wall=new THREE.Mesh(new THREE.BoxGeometry(ww,h,wd),mat);wall.position.set(wx,wy,wz);wall.castShadow=true;grp.add(wall);
      });
      // windows as blue glass
      (r.wins||[]).forEach(win=>{
        const wl=Math.min((win.len||0.35)*r.w,1.6);
        if(win.side==="n"||win.side==="s"){
          const winMesh=new THREE.Mesh(new THREE.BoxGeometry(wl,1.1,.06),gMat);
          winMesh.position.set(cx,ft+1.4, win.side==="n"?cz-r.h/2-.03:cz+r.h/2+.03);grp.add(winMesh);
        } else {
          const winMesh=new THREE.Mesh(new THREE.BoxGeometry(.06,1.1,wl),gMat);
          winMesh.position.set(win.side==="e"?cx+r.w/2+.03:cx-r.w/2-.03,ft+1.4,cz);grp.add(winMesh);
        }
      });
    });
    const roof=new THREE.Mesh(new THREE.BoxGeometry(L.buildW+.2,.16,L.buildD+.2),rMat);
    roof.position.y=wallH+.08;roof.userData.isRoof=true;roof.visible=roofVis;grp.add(roof);
  }
  document.getElementById("ms3").textContent="مدل طرح "+S.selected;
}
function updCam(){
  const ty=(S.layouts?S.layouts[S.selected].floorsCount:2)*1.4;
  cam.position.set(Math.sin(rotY)*Math.cos(rotX)*dist,Math.sin(rotX)*dist+ty,Math.cos(rotY)*Math.cos(rotX)*dist);
  cam.lookAt(0,ty*.55,0);
}
function animate(){animId=requestAnimationFrame(animate);if(autoR){rotY+=.0035;updCam();}ren.render(scene,cam);}

/* ========== FINAL ========== */
function finalOut(){
  const el=document.getElementById("fout");
  if(!el||!S.layouts)return;
  const des=S.layouts[S.selected];
  el.innerHTML=`<div class="met">
    <div class="m"><span>کشور</span><b>${COUNTRIES[S.country].name}</b></div>
    <div class="m"><span>طرح انتخابی</span><b>${des.title}</b></div>
    <div class="m"><span>زمین</span><b>${S.land.w}×${S.land.d}</b></div>
    <div class="m"><span>طبقات</span><b>${des.floorsCount}</b></div>
    <div class="m"><span>راه‌پله</span><b>دارد</b></div>
    <div class="m"><span>آسانسور</span><b>${des.hasElev?"دارد":"ندارد"}</b></div>
    <div class="m"><span>سه طرح دوبعدی</span><b>آماده</b></div>
    <div class="m"><span>سه مدل سه‌بعدی</span><b>آماده</b></div>
  </div>`;
}

/* INIT */
nav();render();
</script>
