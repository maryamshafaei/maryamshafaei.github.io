<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سرآشپز هوشمند</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body { font-family: 'Vazirmatn', system-ui, sans-serif; background-color: #fff7ed; -webkit-tap-highlight-color: transparent; }
        .loader { border-top-color: #f97316; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen pb-12">

    <header class="bg-gradient-to-l from-orange-600 to-amber-500 text-white p-5 shadow-lg rounded-b-3xl mb-6 sticky top-0 z-20">
        <div class="max-w-md mx-auto flex items-center justify-between gap-2">
            <div>
                <h1 class="text-xl font-black">سرآشپز هوشمند 👩‍🍳</h1>
                <p class="text-xs text-orange-100 mt-1">۱۰ مدل پیشنهاد جذاب با هوش مصنوعی!</p>
            </div>
            
            <div class="flex items-center gap-1.5">
                <button onclick="toggleApiModal()" class="bg-white/20 hover:bg-white/30 p-2 rounded-2xl text-xs font-bold transition" title="تنظیمات API">
                    ⚙️
                </button>
                <select id="langSelect" onchange="changeLanguage(this.value)" 
                    class="bg-white/25 text-white font-bold text-xs py-2 px-2.5 rounded-2xl backdrop-blur-md border border-white/30 focus:outline-none cursor-pointer">
                    <option value="fa" class="text-slate-800">🇮🇷 فارسی</option>
                    <option value="en" class="text-slate-800">🇬🇧 English</option>
                    <option value="tr" class="text-slate-800">🇹🇷 Türkçe</option>
                    <option value="ar" class="text-slate-800">🇸🇦 العربية</option>
                </select>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4">
        <div class="bg-white p-5 rounded-3xl shadow-md border border-orange-100 mb-6">
            <label id="inputLabel" class="block text-sm font-bold text-slate-700 mb-2">چه موادی تو یخچال یا کابینت داری؟</label>
            <textarea id="ingredients" rows="3" 
                class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm leading-relaxed"
                placeholder="مثلاً: مرغ، برنج، سیب‌زمینی، گوجه، پیاز..."></textarea>
            
            <div id="quickTags" class="flex flex-wrap gap-1.5 mt-3 mb-4"></div>

            <button onclick="generateRecipes()" id="btn"
                class="w-full bg-orange-500 hover:bg-orange-600 active:scale-95 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-orange-500/30 transition flex items-center justify-center gap-2">
                <span id="btnText">دریافت ۱۰ مدل غذای متنوع ✨</span>
            </button>
        </div>

        <div id="loading" class="hidden flex-col items-center justify-center py-10">
            <div class="loader rounded-full border-4 border-slate-200 h-12 w-12 mb-3"></div>
            <p id="loadingText" class="text-sm text-slate-600 font-bold">هوش مصنوعی در حال خلق ۱۰ گزینه جذاب...</p>
        </div>

        <div id="results" class="space-y-5"></div>
    </main>

    <!-- API Key Modal -->
    <div id="apiModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl">
            <h3 class="font-bold text-lg text-slate-800 mb-2">اتصال به Gemini API (اختیاری)</h3>
            <p class="text-xs text-slate-500 leading-relaxed mb-4">
                اگر می‌خواهید هوش مصنوعی اختصاصی گوگل پاسخ‌ها را بدهد، کلید رایگان خود را اینجا وارد کنید (در غیر این صورت برنامه از موتور هوشمند داخلی استفاده می‌کند):
            </p>
            <input type="password" id="apiKeyInput" placeholder="AIzaSy..." 
                class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-left dir-ltr text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-orange-500">
            <div class="flex gap-2">
                <button onclick="saveApiKey()" class="flex-1 bg-orange-500 text-white font-bold py-2.5 rounded-xl text-sm">ذخیره</button>
                <button onclick="toggleApiModal()" class="flex-1 bg-slate-100 text-slate-700 font-bold py-2.5 rounded-xl text-sm">بستن</button>
            </div>
        </div>
    </div>

    <script>
        let currentLang = 'fa';
        document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_chef_api_key') || '';

        function toggleApiModal() {
            const modal = document.getElementById('apiModal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('gemini_chef_api_key', key);
            toggleApiModal();
            alert('کلید API با موفقیت ذخیره شد!');
        }

        const translations = {
            fa: { dir: 'rtl', label: 'چه موادی تو یخچال یا کابینت داری؟', placeholder: 'مثلاً: مرغ، برنج، سیب‌زمینی، گوجه، پیاز...', btn: 'دریافت ۱۰ مدل غذای متنوع ✨', loading: 'هوش مصنوعی در حال خلق ۱۰ مدل غذای جذاب...', alert: 'لطفاً چند ماده اولیه وارد کن!', ing: '🛒 مواد لازم و ترکیبات:', steps: '👩‍🍳 دستور پخت مرحله به مرحله:', tags: ['مرغ', 'تخم‌مرغ', 'سیب‌زمینی', 'برنج', 'گوشت', 'بادمجان', 'قارچ', 'گوجه'] },
            en: { dir: 'ltr', label: 'What ingredients do you have?', placeholder: 'e.g., chicken, rice, potato, tomato...', btn: 'Generate 10 Recipe Options ✨', loading: 'AI is generating 10 diverse recipes...', alert: 'Please enter some ingredients!', ing: '🛒 Ingredients:', steps: '👩‍🍳 Instructions:', tags: ['Chicken', 'Egg', 'Potato', 'Rice', 'Meat', 'Eggplant', 'Mushroom', 'Tomato'] },
            tr: { dir: 'ltr', label: 'Hangi malzemeleriniz var?', placeholder: 'Örn: tavuk, pirinç, patates, domates...', btn: '10 Farklı Tarif Üret ✨', loading: 'Yapay zeka 10 farklı tarif hazırlıyor...', alert: 'Lütfen malzeme girin!', ing: '🛒 Malzemeler:', steps: '👩‍🍳 Hazırlanışı:', tags: ['Tavuk', 'Yumurta', 'Patates', 'Pirinç', 'Et', 'Patlıcan', 'Mantar', 'Domates'] },
            ar: { dir: 'rtl', label: 'ما هي المكونات المتوفرة لديك؟', placeholder: 'مثال: دجاج، أرز، بطاطس، طماطم...', btn: 'احصل على ١٠ وجبات متنوعة ✨', loading: 'الذكاء الاصطناعي يبتكر ١٠ وصفات...', alert: 'يرجى إدخال المكونات!', ing: '🛒 المكونات:', steps: '👩‍🍳 طريقة التحضير:', tags: ['دجاج', 'بيض', 'بطاطس', 'أرز', 'لحم', 'باذنجان', 'فطر', 'طماطم'] }
        };

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            document.getElementById('htmlTag').setAttribute('dir', t.dir);
            document.getElementById('htmlTag').setAttribute('lang', lang);
            document.getElementById('inputLabel').innerText = t.label;
            document.getElementById('ingredients').placeholder = t.placeholder;
            document.getElementById('btnText').innerText = t.btn;
            document.getElementById('loadingText').innerText = t.loading;
            document.getElementById('results').innerHTML = '';
            renderTags();
        }

        function renderTags() {
            const t = translations[currentLang];
            document.getElementById('quickTags').innerHTML = t.tags.map(tag => 
                `<button onclick="addItem('${tag}')" class="text-xs bg-orange-50 hover:bg-orange-100 text-orange-700 px-3 py-1.5 rounded-full border border-orange-200 transition">+ ${tag}</button>`
            ).join('');
        }

        function addItem(item) {
            const el = document.getElementById('ingredients');
            const sep = (currentLang === 'fa' || currentLang === 'ar') ? '، ' : ', ';
            el.value = !el.value.trim() ? item : el.value + sep + item;
        }

        async function generateRecipes() {
            const t = translations[currentLang];
            const input = document.getElementById('ingredients').value.trim();
            if (!input) return alert(t.alert);

            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            results.innerHTML = '';
            loading.classList.remove('hidden');
            loading.classList.add('flex');

            const apiKey = localStorage.getItem('gemini_chef_api_key');
            let dishes = [];

            // If user added Gemini API key, use it live!
            if (apiKey) {
                try {
                    const prompt = `I have these ingredients: "${input}". Suggest exactly 10 delicious dishes that can be made with these. Return ONLY a valid JSON array with no extra text: [{"name":"Dish name in Persian","en":"English name for image","time":"Cooking time","ing":"Ingredients list","steps":"Step by step instructions"}]`;
                    
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } })
                    });
                    const data = await response.json();
                    const text = data.candidates[0].content.parts[0].text;
                    dishes = JSON.parse(text);
                } catch (e) {
                    console.log("API Error, switching to smart fallback");
                }
            }

            // Fallback or default 10 varied recipes generator
            if (dishes.length === 0) {
                const words = input.split(/[\s،,-]+/).filter(w => w.length > 1);
                const main1 = words[0] || 'ماده';
                const main2 = words[1] || main1;

                dishes = [
                    { name: `۱. خوراک ویژه و مجلسی با ${main1}`, en: `Gourmet dish with ${input}`, time: '۴۰ دقیقه', ing: `${input}، پیاز داغ، زعفران، روغن، نمک و فلفل`, steps: '۱. پیاز را تفت داده و مواد را اضافه کنید.\n۲. زعفران و ادویه زده و بگذارید بپزد.' },
                    { name: `۲. سرخ‌کرده یا گریل طلایی سرآشپز`, en: `Crispy pan fried special ${main1}`, time: '۲۵ دقیقه', ing: `${main1}، کره، پودر سیر، ادویه مخصوص`, steps: '۱. مواد را مزه‌دار کرده و در تابه با کره سرخ کنید.\n۲. به صورت گرم سرو کنید.' },
                    { name: `۳. خورشت یا سوپ گرم ترکیبی`, en: `Hearty stew or soup with ${input}`, time: '۵۰ دقیقه', ing: `مجموعه مواد (${input})، رب، پیاز، لیموعمانی`, steps: '۱. پیاز و رب را تفت داده، مواد را اضافه کنید.\n۲. آب جوش ریخته و اجازه دهید جا بیفتد.' },
                    { name: `۴. مخلوط‌پلو سنتی با ${main1}`, en: `Traditional mixed rice with ${input}`, time: '۶۰ دقیقه', ing: `برنج، ${input}، روغن و زعفران`, steps: '۱. برنج را آبکش کنید.\n۲. مواد تفت‌داده را لابه‌لای برنج دم بگذارید.' },
                    { name: `۵. خوراک سریع تابهٔ فوری`, en: `Quick skillet meal with ${input}`, time: '۲۰ دقیقه', ing: `${input}، تخم‌مرغ یا پنیر، روغن`, steps: '۱. مواد را ریز خرد کرده و در تابه تفت دهید.\n۲. در صورت تمایل تخم‌مرغ افزوده و سرو کنید.' },
                    { name: `۶. گراتن و پخت تنوری با پنیر`, en: `Cheesy baked casserole with ${input}`, time: '۴۵ دقیقه', ing: `${input}، پنیر پیتزا، شیر، کره، آرد`, steps: '۱. مواد را تفت داده و در ظرف فر بریزید.\n۲. با پنیر پوشانده و گراتینه کنید.' },
                    { name: `۷. سالاد گرم رژیمی و مغذی`, en: `Warm healthy diet salad with ${input}`, time: '۲۰ دقیقه', ing: `${input}، سبزیجات، آبلیمو، روغن زیتون`, steps: '۱. مواد را گریل یا بخارپز کنید.\n۲. روی سبزیجات چیده و سس بزنید.' },
                    { name: `۸. رول یا ساندویچ نانی خوشمزه`, en: `Delicious wrap or sandwich with ${input}`, time: '۱۵ دقیقه', ing: `${input}، نان، سس، کاهو و گوجه`, steps: '۱. مواد را با پیاز تفت دهید.\n۲. داخل نان به همراه کاهو ساندویچ کنید.' },
                    { name: `۹. املت یا خاگینه ترکیبی خلاقانه`, en: `Creative mixed omelet with ${input}`, time: '۱۵ دقیقه', ing: `${input}، تخم‌مرغ، کره و ادویه`, steps: '۱. مواد را خرد کرده در تابه تفت دهید.\n۲. تخم‌مرغ‌ها را روی آن بشکنید.' },
                    { name: `۱۰. ته چین یا برنج قالبی زعفرانی`, en: `Saffron layered Tahchin with ${input}`, time: '۵۵ دقیقه', ing: `برنج، ماست، زرده تخم‌مرغ، زعفران، ${input}`, steps: '۱. برنج را با ماست و زعفران مخلوط کنید.\n۲. مواد را وسط برنج گذاشته و دم بگذارید.' }
                ];
            }

            results.innerHTML = dishes.map((r, i) => {
                const imgPrompt = encodeURIComponent(`${r.en || r.name}, professional restaurant food photography, 8k, warm lighting`);
                const imgUrl = `https://image.pollinations.ai/prompt/${imgPrompt}?width=700&height=500&nologo=true&seed=${Date.now() + i}`;
                
                return `
                <div class="bg-white rounded-3xl shadow-md border border-orange-100 overflow-hidden transition hover:shadow-lg">
                    <div class="relative h-52 bg-slate-100">
                        <img src="${imgUrl}" alt="${r.name}" class="w-full h-full object-cover" loading="lazy">
                        <span class="absolute top-3 left-3 bg-black/60 backdrop-blur-md text-white text-xs px-3 py-1.5 rounded-full">⏱️ ${r.time || '۳۰ دقیقه'}</span>
                    </div>
                    <div class="p-5">
                        <h2 class="text-lg font-black text-slate-800 mb-3">${r.name}</h2>
                        <div class="bg-orange-50 rounded-2xl p-3 mb-3 border border-orange-100">
                            <b class="text-xs text-orange-800 block mb-1">${t.ing}</b>
                            <p class="text-xs text-slate-700 leading-relaxed">${r.ing}</p>
                        </div>
                        <div>
                            <b class="text-xs text-slate-700 block mb-1">${t.steps}</b>
                            <p class="text-xs text-slate-600 leading-6 whitespace-pre-line">${r.steps}</p>
                        </div>
                    </div>
                </div>`;
            }).join('');

            loading.classList.add('hidden');
            loading.classList.remove('flex');
        }

        renderTags();
    </script>
</body>
</html>
